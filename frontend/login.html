<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — FoodResQ AI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
  
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      background: radial-gradient(circle at 50% 0%, rgba(185, 231, 105, 0.12) 0%, transparent 60%);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: 2rem;
      box-shadow: var(--shadow-float);
    }
    .persona-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .persona-btn {
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface-subtle);
      font-size: 0.75rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .persona-btn:hover, .persona-btn.active {
      border-color: var(--color-primary);
      background: var(--color-primary-light);
      color: var(--color-primary);
    }
  </style>
</head>
<body class="auth-page">

  <!-- Logo -->
  <a href="index.html" class="brand-logo" style="margin-bottom: 1.5rem;">
    <div class="brand-icon"><i class="fa-solid fa-leaf"></i></div>
    <div class="brand-title">FoodResQ <span style="color: var(--color-primary);">AI</span></div>
  </a>

  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h2 style="font-size: 1.4rem; font-weight: 800;">Sign In to Console</h2>
      <p class="text-xs text-muted" style="margin-top: 0.25rem;">
        Enter credentials or pick a demo role to test workflows
      </p>
    </div>

    <!-- 1-Click Demo Persona Picker -->
    <div style="background: var(--color-surface-subtle); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 0.75rem; margin-bottom: 1.25rem;">
      <div style="font-size: 0.75rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--color-text-main); display: flex; align-items: center; gap: 0.35rem;">
        <i class="fa-solid fa-wand-magic-sparkles text-primary"></i> 1-Click Demo Personas:
      </div>
      <div class="persona-grid">
        <button type="button" class="persona-btn active" onclick="pickDemoPersona('admin')">
          <span>👑 Admin (Lead)</span>
        </button>
        <button type="button" class="persona-btn" onclick="pickDemoPersona('provider')">
          <span>🍲 Mess Warden</span>
        </button>
        <button type="button" class="persona-btn" onclick="pickDemoPersona('recipient')">
          <span>❤️ Shelter NGO</span>
        </button>
        <button type="button" class="persona-btn" onclick="pickDemoPersona('driver')">
          <span>🚚 EV Driver</span>
        </button>
      </div>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address <span class="required">*</span></label>
        <input type="email" id="login-email" class="form-control" value="ananya@foodresq.ai" required>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
          <label class="form-label" for="login-password" style="margin-bottom: 0;">Password <span class="required">*</span></label>
          <span class="text-xs text-muted" style="cursor: pointer;" onclick="showToast('Demo note: Any password grants demo access.', 'info')">Forgot?</span>
        </div>
        <div style="position: relative;">
          <input type="password" id="login-password" class="form-control" value="demo12345" required>
          <button type="button" id="toggle-pwd-btn" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--color-text-muted);">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
        <label class="checkbox-label">
          <input type="checkbox" id="remember-me" checked>
          <span style="font-size: 0.775rem;">Remember demo session</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
        <span>Sign In to Dashboard</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.25rem; font-size: 0.8rem; color: var(--color-text-secondary);">
      New partner organisation? <a href="register.html" style="font-weight: 700; color: var(--color-primary);">Register here</a>
    </div>

    <div style="text-align: center; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--color-border); font-size: 0.7rem; color: var(--color-text-muted);">
      Notice: Frontend-only simulated authentication environment.
    </div>
  </div>

  <script src="js/demo-data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
