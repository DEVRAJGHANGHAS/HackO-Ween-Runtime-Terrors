<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Organisation — FoodResQ AI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
  
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2.5rem 1rem;
      background: radial-gradient(circle at 50% 0%, rgba(185, 231, 105, 0.12) 0%, transparent 60%);
    }
    .auth-card {
      width: 100%;
      max-width: 560px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: 2rem 2.25rem;
      box-shadow: var(--shadow-float);
    }
  </style>
</head>
<body class="auth-page">

  <a href="index.html" class="brand-logo" style="margin-bottom: 1.5rem;">
    <div class="brand-icon"><i class="fa-solid fa-leaf"></i></div>
    <div class="brand-title">FoodResQ <span style="color: var(--color-primary);">AI</span></div>
  </a>

  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h2 style="font-size: 1.4rem; font-weight: 800;">Register Partner Organisation</h2>
      <p class="text-xs text-muted" style="margin-top: 0.25rem;">
        Join the network as a food surplus provider or recipient shelter
      </p>
    </div>

    <form id="register-form">
      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name <span class="required">*</span></label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Rameshwar Meena" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address <span class="required">*</span></label>
          <input type="email" id="reg-email" class="form-control" placeholder="name@hostel.edu.in" required>
        </div>
      </div>

      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label" for="reg-org">Organisation Name <span class="required">*</span></label>
          <input type="text" id="reg-org" class="form-control" placeholder="e.g. Aryabhatta Hostel Mess" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-type">Facility Type <span class="required">*</span></label>
          <select id="reg-type" class="form-control" required>
            <option value="hostel">College / University Hostel Mess</option>
            <option value="restaurant">Hotel / Banquet Kitchen</option>
            <option value="cafeteria">Corporate Food Court</option>
            <option value="ngo">NGO Relief Shelter</option>
            <option value="food_bank">Food Bank Distribution Hub</option>
            <option value="community_kitchen">Community Dining Kitchen</option>
          </select>
        </div>
      </div>

      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label" for="reg-city">City / Region <span class="required">*</span></label>
          <input type="text" id="reg-city" class="form-control" value="Gurugram" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-role">Platform Role <span class="required">*</span></label>
          <select id="reg-role" class="form-control" required>
            <option value="provider">Food Provider (Surplus Donor)</option>
            <option value="recipient">Recipient Organisation (Shelter / NGO)</option>
            <option value="driver">Delivery Partner (EV Fleet)</option>
            <option value="admin">Platform Administrator</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-password">Password <span class="required">*</span></label>
        <input type="password" id="reg-password" class="form-control" placeholder="Choose a password (min 6 characters)" required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
        <span>Create Account & Enter Console</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.25rem; font-size: 0.8rem; color: var(--color-text-secondary);">
      Already registered? <a href="login.html" style="font-weight: 700; color: var(--color-primary);">Sign In</a>
    </div>
  </div>

  <script src="js/demo-data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
